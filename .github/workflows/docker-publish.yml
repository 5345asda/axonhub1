# Publish Docker images to GitHub Container Registry.
# Reuse the upstream native-architecture build workflow without depending on
# Docker Hub credentials that belong to the upstream repository.

name: Publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.0.0-rc.3
        required: true
        type: string
      branch:
        description: Branch or commit to build
        required: true
        type: string
        default: codex/key-model-sticky

jobs:
  build_single_arch:
    name: Build & push (release)
    uses: ./.github/workflows/docker-build.yml
    with:
      mode: release
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      registry: ghcr.io
      image: ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write

  create_manifests:
    name: Create multi-arch manifests (GHCR)
    needs: [build_single_arch]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      contents: read
    steps:
      - name: Extract tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG=$INPUT_TAG
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must look like v1.2.3, got: $TAG" >&2
              exit 1
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (GHCR - version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:${TAG} \
            ghcr.io/${{ github.repository }}:${TAG}-amd64 \
            ghcr.io/${{ github.repository }}:${TAG}-arm64

      - name: Create & push manifest (GHCR - latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:latest-amd64 \
            ghcr.io/${{ github.repository }}:latest-arm64
